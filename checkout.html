<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Test Checkout</title>
    <!-- DO NOT USE IN PRODUCTION -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <h1>Razorpay Test Page</h1>
    <p>Use this to create a real payment against your order_id.</p>

    <button id="rzp-button1">Pay with Razorpay</button>

    <script>
        // --- PASTE YOUR VALUES HERE ---
        const YOUR_KEY_ID = "rzp_test_RBC4ETSsTi1taj"; // <-- PASTE YOUR KEY ID FROM THE DASHBOARD
        const YOUR_ORDER_ID = "order_RQ7EzDAWOenPZa";   // <-- PASTE THE order_id FROM YOUR POSTMAN RESPONSE
        // -----------------------------

        var options = {
            "key": YOUR_KEY_ID,
            "amount": "100", // Example: 500000 paise for ₹5000. This is just for display.
            "currency": "INR",
            "name": "Acme Corp", //Your Company Name
            "description": "Test Transaction",
            "image": "https://example.com/your_logo.jpg",
            "order_id": YOUR_ORDER_ID, //This links the payment to your order
            "handler": function (response){
                // This function is called when payment is successful
                alert("Payment Successful!");
                alert("Payment ID: " + response.razorpay_payment_id);
                alert("Order ID: " + response.razorpay_order_id);
                alert("Signature: " + response.razorpay_signature);

                // You can now use this payment_id in Postman
                console.log("COPY THIS PAYMENT ID FOR POSTMAN:", response.razorpay_payment_id);
            },
            "prefill": {
                "name": "Gaurav Kumar",
                "email": "gaurav.kumar@example.com",
                "contact": "9000090000"
            },
            "notes": {
                "address": "Razorpay Corporate Office"
            },
            "theme": {
                "color": "#3399cc"
            }
        };

        var rzp1 = new Razorpay(options);

        rzp1.on('payment.failed', function (response){
                alert("Payment Failed!");
                alert(response.error.code);
                alert(response.error.description);
                alert(response.error.source);
                alert(response.error.step);
                alert(response.error.reason);
                alert(response.error.metadata.order_id);
                alert(response.error.metadata.payment_id);
        });

        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
    </script>

</body>
</html>
